apiVersion: v1
kind: Secret
metadata:
  name: mssql-secret
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: "YourStrong@Password123"
  DB_PASSWORD: "YourStrong@Password123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-mssql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fitness-mssql
  template:
    metadata:
      labels:
        app: fitness-mssql
    spec:
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Developer"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-secret
                  key: MSSQL_SA_PASSWORD
          volumeMounts:
            - name: mssql-data
              mountPath: /var/opt/mssql
      volumes:
        - name: mssql-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fitness-mssql
spec:
  type: ClusterIP
  selector:
    app: fitness-mssql
  ports:
    - port: 1433
      targetPort: 1433
      protocol: TCP